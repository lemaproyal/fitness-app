<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übungsdatenbank – Darstellungs-Demo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16181d;
    --muted: #62676f;
    --line: #dfe2e7;
    --accent: #d4462a;
    --figure: #16181d;
    --ground: #b8bdc5;
    --chip: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1c1f25;
      --ink: #eceef1;
      --muted: #9aa1ab;
      --line: #2c313a;
      --accent: #ff6b47;
      --figure: #eceef1;
      --ground: #454b55;
      --chip: #262b33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0 0 28px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  .top { display: flex; gap: 18px; align-items: flex-start; }
  .stage {
    flex: 0 0 148px; background: var(--chip); border-radius: 10px;
    padding: 6px; cursor: pointer; position: relative;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .stage::after {
    content: "❚❚"; position: absolute; right: 8px; bottom: 6px;
    font-size: 10px; color: var(--muted); letter-spacing: 1px;
  }
  .stage.paused::after { content: "▶"; }
  .meta { flex: 1 1 auto; min-width: 0; }
  h2 { font-size: 1.05rem; margin: 2px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--chip); color: var(--muted);
    padding: 3px 8px; border-radius: 999px;
  }
  .chip.lvl { color: var(--accent); }
  ol, ul { margin: 0; padding-left: 1.15em; }
  li { margin-bottom: 5px; }
  .label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 16px 0 6px;
  }
  .hint li { color: var(--muted); font-size: 0.92rem; }
  .dose {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 0.88rem; color: var(--muted);
  }
  @media (max-width: 520px) {
    .top { flex-direction: column; }
    .stage { flex: none; width: 60%; align-self: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Übungsdatenbank – Darstellungs-Demo</h1>
  <p class="sub">Drei Beispieleinträge. Die Bewegungssequenzen sind reine Daten aus der Datenbank, keine Bild- oder Videodateien. Tippen pausiert.</p>
  <div id="liste"></div>
</div>

<script>
const SKELETT = {
  knochen: [["nacken","huefte"],["huefte","knie"],["knie","knoechel"],
            ["knoechel","zeh"],["nacken","ellbogen"],["ellbogen","hand"]]
};

const UEBUNGEN = [
  {
    id: "squat-jump", name: "Squat Jump", kategorie: "Plyometrie", level: "Mittel",
    equipment: "ohne Gerät", muskeln: "Quadrizeps · Gesäß · Waden",
    ausfuehrung: [
      "Aufrecht stehen, Füße etwa hüftbreit, Gewicht auf dem ganzen Fuß.",
      "Zügig in die halbe Kniebeuge absenken, Hüfte nach hinten, Arme schwingen nach hinten.",
      "Ohne Pause explosiv nach oben abdrücken, Arme schwingen nach vorne oben mit.",
      "Mit dem Fußballen zuerst landen, dann Ferse, Knie und Hüfte weich nachgeben lassen.",
      "Kurz stabilisieren, erst dann die nächste Wiederholung."
    ],
    hinweise: [
      "Leise landen — der beste Selbsttest für eine kontrollierte Landung.",
      "Absenken und Absprung sind eine Bewegung, keine zwei.",
      "Knie zeigen in Richtung der Fußspitzen, nicht nach innen."
    ],
    dose: "4 Sätze · 5 Wiederholungen · 90 s Pause",
    animation: {
      viewBox: "0 0 200 260", boden: 240, dauerMs: 2400,
      keyTimes: [0, 0.3, 0.45, 0.6, 1],
      posen: [
        {kopf:[100,60], nacken:[100,78], huefte:[100,130], knie:[100,178], knoechel:[100,236], zeh:[118,240], ellbogen:[100,105], hand:[100,130]},
        {kopf:[100,106], nacken:[96,122], huefte:[82,168], knie:[114,186], knoechel:[100,236], zeh:[118,240], ellbogen:[78,132], hand:[62,142]},
        {kopf:[100,42], nacken:[100,58], huefte:[100,110], knie:[100,162], knoechel:[100,216], zeh:[108,230], ellbogen:[104,34], hand:[108,12]},
        {kopf:[102,86], nacken:[98,102], huefte:[88,152], knie:[110,182], knoechel:[100,236], zeh:[118,240], ellbogen:[110,116], hand:[122,124]},
        {kopf:[100,60], nacken:[100,78], huefte:[100,130], knie:[100,178], knoechel:[100,236], zeh:[118,240], ellbogen:[100,105], hand:[100,130]}
      ]
    }
  },
  {
    id: "pogo-hops", name: "Pogo Hops", kategorie: "Plyometrie", level: "Einstieg",
    equipment: "ohne Gerät", muskeln: "Waden · Achillessehne · Fußgewölbe",
    ausfuehrung: [
      "Aufrecht stehen, Füße hüftbreit, Knie fast gestreckt und dort halten.",
      "Nur aus dem Sprunggelenk kleine, schnelle Hüpfer ausführen.",
      "Auf dem Fußballen landen, die Ferse berührt den Boden nur kurz und leicht.",
      "Rumpf bleibt fest, der Oberkörper federt nicht mit."
    ],
    hinweise: [
      "Ziel ist kurzer Bodenkontakt, nicht Höhe.",
      "Der Rhythmus zählt: schnell und gleichmäßig wie ein Flummi.",
      "Ideal als Einstieg und zum Aufwärmen vor allen anderen Sprüngen."
    ],
    dose: "3 Sätze · 20 Wiederholungen · 60 s Pause",
    animation: {
      viewBox: "0 0 200 260", boden: 240, dauerMs: 600,
      keyTimes: [0, 0.35, 1],
      posen: [
        {kopf:[100,66], nacken:[100,84], huefte:[100,136], knie:[100,182], knoechel:[100,238], zeh:[116,240], ellbogen:[100,111], hand:[100,134]},
        {kopf:[100,42], nacken:[100,60], huefte:[100,112], knie:[100,160], knoechel:[100,218], zeh:[112,232], ellbogen:[100,87], hand:[100,110]},
        {kopf:[100,66], nacken:[100,84], huefte:[100,136], knie:[100,182], knoechel:[100,238], zeh:[116,240], ellbogen:[100,111], hand:[100,134]}
      ]
    }
  },
  {
    id: "plyo-liegestuetz", name: "Plyo-Liegestütz", kategorie: "Plyometrie", level: "Fortgeschritten",
    equipment: "ohne Gerät", muskeln: "Brust · Trizeps · vordere Schulter",
    ausfuehrung: [
      "Liegestützposition, Hände etwa schulterbreit, Körper bildet eine Linie von Kopf bis Ferse.",
      "Kontrolliert absenken, bis die Brust knapp über dem Boden ist.",
      "Explosiv hochdrücken, bis die Hände vom Boden abheben.",
      "Weich mit leicht gebeugten Armen auffangen und direkt weiter absenken."
    ],
    hinweise: [
      "Progression: an einer Erhöhung → am Boden mit Handabheben → mit Klatschen.",
      "Die Hüfte darf nicht durchhängen; Gesäß und Bauch bleiben angespannt.",
      "Bei Handgelenksbeschwerden Hanteln oder Parallettes als Griffe nutzen."
    ],
    dose: "3 Sätze · 5 Wiederholungen · 90 s Pause",
    animation: {
      viewBox: "0 0 240 220", boden: 200, dauerMs: 2200,
      keyTimes: [0, 0.45, 0.62, 1],
      posen: [
        {kopf:[192,140], nacken:[172,150], huefte:[106,162], knie:[66,174], knoechel:[34,184], zeh:[24,200], ellbogen:[174,172], hand:[174,196]},
        {kopf:[184,170], nacken:[164,178], huefte:[104,182], knie:[64,184], knoechel:[33,186], zeh:[24,200], ellbogen:[150,190], hand:[172,196]},
        {kopf:[196,128], nacken:[176,138], huefte:[108,152], knie:[68,166], knoechel:[35,178], zeh:[24,200], ellbogen:[176,160], hand:[176,184]},
        {kopf:[192,140], nacken:[172,150], huefte:[106,162], knie:[66,174], knoechel:[34,184], zeh:[24,200], ellbogen:[174,172], hand:[174,196]}
      ]
    }
  }
];

const NS = "http://www.w3.org/2000/svg";
const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const lerp = (a, b, t) => a + (b - a) * t;

function baueFigur(anim) {
  const svg = el("svg", { viewBox: anim.viewBox, role: "img" });
  const vb = anim.viewBox.split(" ").map(Number);
  svg.appendChild(el("line", {
    x1: vb[0] + 8, y1: anim.boden, x2: vb[0] + vb[2] - 8, y2: anim.boden,
    stroke: "var(--ground)", "stroke-width": 2, "stroke-linecap": "round"
  }));
  const kopf = el("circle", { r: 12, fill: "none", stroke: "var(--figure)", "stroke-width": 5 });
  const knochen = SKELETT.knochen.map(() => {
    const l = el("line", { stroke: "var(--figure)", "stroke-width": 5, "stroke-linecap": "round" });
    svg.appendChild(l); return l;
  });
  svg.appendChild(kopf);
  return { svg, kopf, knochen };
}

// Interpoliert zwischen zwei Posen und schreibt das Ergebnis ins SVG.
function zeichne(figur, anim, t) {
  const kt = anim.keyTimes;
  let i = 0;
  while (i < kt.length - 2 && t > kt[i + 1]) i++;
  const spanne = kt[i + 1] - kt[i];
  const f = spanne > 0 ? Math.min(1, Math.max(0, (t - kt[i]) / spanne)) : 0;
  const weich = f * f * (3 - 2 * f); // Ease-in-out, damit die Bewegung nicht mechanisch wirkt
  const a = anim.posen[i], b = anim.posen[i + 1];
  const p = g => [lerp(a[g][0], b[g][0], weich), lerp(a[g][1], b[g][1], weich)];

  const k = p("kopf");
  figur.kopf.setAttribute("cx", k[0]);
  figur.kopf.setAttribute("cy", k[1]);
  SKELETT.knochen.forEach(([von, bis], n) => {
    const v = p(von), w = p(bis), l = figur.knochen[n];
    l.setAttribute("x1", v[0]); l.setAttribute("y1", v[1]);
    l.setAttribute("x2", w[0]); l.setAttribute("y2", w[1]);
  });
}

function karte(u) {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `
    <div class="top">
      <div class="stage"></div>
      <div class="meta">
        <h2>${u.name}</h2>
        <div class="chips">
          <span class="chip">${u.kategorie}</span>
          <span class="chip lvl">${u.level}</span>
          <span class="chip">${u.equipment}</span>
        </div>
        <div class="label">Ausführung</div>
        <ol>${u.ausfuehrung.map(s => `<li>${s}</li>`).join("")}</ol>
        <div class="label">Hinweise</div>
        <ul class="hint">${u.hinweise.map(s => `<li>${s}</li>`).join("")}</ul>
        <div class="dose">${u.muskeln}<br>${u.dose}</div>
      </div>
    </div>`;

  const buehne = c.querySelector(".stage");
  const figur = baueFigur(u.animation);
  buehne.appendChild(figur.svg);

  let laeuft = true, start = null, standT = 0;
  buehne.addEventListener("click", () => {
    laeuft = !laeuft; start = null;
    buehne.classList.toggle("paused", !laeuft);
  });

  function tick(ts) {
    if (laeuft) {
      if (start === null) start = ts - standT * u.animation.dauerMs;
      standT = ((ts - start) % u.animation.dauerMs) / u.animation.dauerMs;
      zeichne(figur, u.animation, standT);
    }
    requestAnimationFrame(tick);
  }
  zeichne(figur, u.animation, 0);
  requestAnimationFrame(tick);
  return c;
}

const liste = document.getElementById("liste");
UEBUNGEN.forEach(u => liste.appendChild(karte(u)));
</script>
</body>
</html>
