plugins {
    id "com.android.application"
}

// Versionsnummer = Zahl der Commits. Android installiert ein Update nur, wenn die
// Nummer größer ist als die der installierten Fassung – sonst bliebe nur
// Deinstallieren, und das löscht alle Trainingsdaten. Die Commit-Zahl wächst mit
// jeder Änderung, unabhängig davon, wie der Workflow heißt oder wie oft er läuft.
def gitAusgabe = { String... befehl ->
    providers.exec { commandLine(["git"] + befehl.toList()) }.standardOutput.asText.get().trim()
}
if (gitAusgabe("rev-parse", "--is-shallow-repository") == "true") {
    throw new GradleException("Die Versionsnummer braucht die ganze Git-Historie (actions/checkout mit fetch-depth: 0).")
}
def buildNummer = gitAusgabe("rev-list", "--count", "HEAD").toInteger()

def signaturDatei = System.getenv("SIGNATUR_DATEI")

android {
    namespace "de.lemaproyal.fitness"
    compileSdk 35

    defaultConfig {
        applicationId "de.lemaproyal.fitness"
        // Android 10: ab hier schreibt die App ohne Speicher-Berechtigung in den Download-Ordner.
        minSdk 29
        targetSdk 35
        versionCode buildNummer
        versionName "1.0.${buildNummer}"
        resValue "string", "app_name", "Fitness"
    }

    signingConfigs {
        release {
            // Der Schlüssel kommt aus den GitHub-Secrets (siehe APK.md). Er muss für
            // immer derselbe bleiben: Eine APK mit anderem Schlüssel lässt sich nur nach
            // Deinstallation installieren – und die löscht alle Trainingsdaten.
            if (signaturDatei) {
                storeFile file(signaturDatei)
                storeType "pkcs12"
                storePassword System.getenv("SIGNATUR_PASSWORT")
                keyAlias "fitness"
                keyPassword System.getenv("SIGNATUR_PASSWORT")
            }
        }
    }

    buildTypes {
        debug {
            // Eigene App neben der echten: Die Test-APK ist mit einem wechselnden
            // Schlüssel signiert. Hätte sie dieselbe Kennung, ließe sich die echte
            // App danach nur nach Deinstallation (= Datenverlust) installieren.
            applicationIdSuffix ".test"
            resValue "string", "app_name", "Fitness (Test)"
        }
        release {
            signingConfig signaturDatei ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Nur für addWebMessageListener: Damit ist die Datei-Brücke ausschließlich für
    // die eigene Adresse sichtbar, nicht für eingebettete YouTube-Player.
    implementation "androidx.webkit:webkit:1.12.1"
}
