# Baut die Android-App (Ordner android/), prüft sie im Emulator und
# veröffentlicht sie auf main als Release „apk“ – direkt am Handy ladbar unter
# https://github.com/lemaproyal/fitness-app/releases/download/apk/fitness.apk
#
# Am Rechner braucht es dafür weder Java noch Android SDK.

name: Android-APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Node 22 bringt WebSocket mit – den braucht android/test/cdp.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Debug-APK bauen
        run: gradle -p android assembleDebug

      - name: Emulator-Beschleunigung (KVM) freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Android-Emulator prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test/emulator-test.sh android/app/build/outputs/apk/debug/app-debug.apk test-ergebnis

      - name: Test-Screenshots aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ergebnis
          path: test-ergebnis

      - name: Signierte APK bauen
        id: signiert
        env:
          SIGNATUR_BASE64: ${{ secrets.SIGNATUR_BASE64 }}
          SIGNATUR_PASSWORT: ${{ secrets.SIGNATUR_PASSWORT }}
        run: |
          if [ -z "$SIGNATUR_BASE64" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt (siehe APK.md) – nur die Debug-APK wurde gebaut."
            exit 0
          fi
          echo "$SIGNATUR_BASE64" | base64 -d > "$RUNNER_TEMP/signatur.p12"
          SIGNATUR_DATEI="$RUNNER_TEMP/signatur.p12" gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk fitness.apk
          echo "fertig=ja" >> "$GITHUB_OUTPUT"

      - name: Signierte APK aufheben
        if: steps.signiert.outputs.fertig == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: fitness-apk
          path: fitness.apk

      - name: Als Release „apk“ veröffentlichen
        if: steps.signiert.outputs.fertig == 'ja' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk fitness.apk \
            --title "Fitness-App für Android" \
            --notes "Build ${{ github.run_number }} vom $(date +%F). Am Handy fitness.apk laden und öffnen – Anleitung in APK.md."
