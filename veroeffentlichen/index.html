<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4462a">
<meta name="description" content="Übungskatalog und Trainingsplanung für den 2er-Split.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Fitness</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16181d; --muted: #62676f;
    --line: #dfe2e7; --accent: #d4462a; --chip: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1c1f25; --ink: #eceef1; --muted: #9aa1ab;
      --line: #2c313a; --accent: #ff6b47; --chip: #262b33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  header img { width: 44px; height: 44px; border-radius: 11px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }

  /* Die beiden Trainingstage nebeneinander — der Einstieg ins Training. */
  .tage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  a.tag-kachel {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 148px; padding: 18px;
    background: var(--card); border: 1px solid var(--line);
    border-top: 4px solid var(--tagfarbe);
    border-radius: 14px; color: inherit; text-decoration: none;
  }
  a.tag-kachel:hover { border-color: var(--tagfarbe); border-top-color: var(--tagfarbe); }
  .tag-kachel .name { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
  .tag-kachel .anzahl { font-size: 0.86rem; color: var(--muted); }
  .tag-kachel .anzahl b {
    display: block; font-size: 1.8rem; line-height: 1.1; color: var(--tinte);
    font-variant-numeric: tabular-nums; font-weight: 700;
  }

  a.kachel {
    display: block; width: 100%; text-align: left; font: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; color: inherit; text-decoration: none; margin-bottom: 26px;
  }
  a.kachel + a.kachel { margin-top: -18px; }
  a.kachel:hover { border-color: var(--accent); }
  .kachel h2 { margin: 0 0 3px; font-size: 1.05rem; }
  .kachel p { margin: 0; color: var(--muted); font-size: 0.88rem; }

  .hinweis {
    background: var(--chip); border-radius: 12px; padding: 14px 16px;
    font-size: 0.88rem; color: var(--muted); margin-bottom: 12px;
  }
  .hinweis b { color: var(--ink); }
  .hinweis button {
    font: inherit; margin-top: 10px; cursor: pointer;
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; font-weight: 600;
  }
  /* Auf schmalen Geräten bleiben es zwei Spalten — nur etwas kompakter. */
  @media (max-width: 420px) {
    .tage { gap: 10px; }
    a.tag-kachel { min-height: 124px; padding: 14px; }
    .tag-kachel .name { font-size: 1.25rem; }
    .tag-kachel .anzahl b { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="./icons/icon-192.png" alt="">
    <h1>Fitness</h1>
  </header>

  <div class="tage" id="tage"></div>

  <a class="kachel" href="./verlauf.html">
    <h2>Verlauf</h2>
    <p>Alle absolvierten Trainings — nachschlagen und exportieren</p>
  </a>

  <a class="kachel" href="./verwaltung.html">
    <h2>Einstellungen</h2>
    <p>Übungen anlegen, bearbeiten und Videosequenzen markieren</p>
  </a>

  <div class="hinweis" id="installHinweis" hidden></div>
  <div class="hinweis" id="offlineHinweis" hidden></div>
</div>

<script type="module" src="./src/start.js"></script>
</body>
</html>
